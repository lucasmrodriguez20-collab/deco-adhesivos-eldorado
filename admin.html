
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración | Deco Adhesivos Eldorado</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --green: #35483d;
  --sand: #c6b49a;
  --cream: #f4f0e8;
  --dark: #292824;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--dark);
  font-family: Arial, sans-serif;
}
header {
  background: var(--green);
  color: white;
  padding: 22px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
header h1 { font-size: 21px; margin: 0; }
header p { margin: 6px 0 0; font-size: 12px; }
button, input, textarea, select { font: inherit; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 7px;
  padding: 11px 15px;
}
.primary { background: var(--green); color: white; }
.secondary { background: #e8dfd1; color: var(--dark); }
.danger { background: #f6dddd; color: #8b2020; }
main { max-width: 1100px; margin: 30px auto; padding: 0 18px 50px; }
.panel {
  background: white;
  border: 1px solid #e5ded2;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 22px;
}
h2 { margin-top: 0; font-size: 22px; }
label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
input, textarea, select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d5ccbd;
  border-radius: 7px;
  background: white;
  margin-bottom: 15px;
}
textarea { min-height: 85px; resize: vertical; }
.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 16px;
}
.check {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 16px;
}
.check input { width: auto; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
#message { margin: 14px 0; line-height: 1.5; overflow-wrap: anywhere; }
.muted { color: #716e65; font-size: 13px; line-height: 1.5; }
#productsList { display: grid; gap: 12px; }
.item {
  border: 1px solid #e5ded2;
  border-radius: 9px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.item img {
  width: 85px;
  height: 85px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--cream);
}
.item-info { flex: 1; min-width: 0; }
.item-info strong { display: block; margin-bottom: 5px; overflow-wrap: anywhere; }
.item-info small { display: block; color: #716e65; margin-top: 4px; }
.item-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.hidden { display: none !important; }
@media(max-width:600px) {
  header { align-items: flex-start; flex-direction: column; }
  .fields { grid-template-columns: 1fr; }
  .item { align-items: flex-start; flex-wrap: wrap; }
  .item-info { min-width: calc(100% - 110px); }
  .item-actions { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>DECO ADHESIVOS</h1>
    <p>Panel privado de administración · Eldorado, Misiones</p>
  </div>
  <button id="logout" class="secondary hidden">Cerrar sesión</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Ingresar al panel</h2>
    <p class="muted">Acceso exclusivo para el administrador del catálogo.</p>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Iniciar sesión</button>
    </form>
  </section>

  <section id="adminPanel" class="hidden">
    <section class="panel">
      <h2 id="formTitle">Agregar producto</h2>
      <form id="productForm">
        <input id="productId" type="hidden">

        <div class="fields">
          <div>
            <label for="name">Nombre del producto *</label>
            <input id="name" required maxlength="180">
          </div>
          <div>
            <label for="code">Código *</label>
            <input id="code" required maxlength="80">
          </div>
          <div>
            <label for="category">Categoría *</label>
            <input id="category" required maxlength="100"
              placeholder="Ej.: Placas autoadhesivas">
          </div>
          <div>
            <label for="price">Precio en pesos argentinos</label>
            <input id="price" type="number" min="0" step="0.01"
              placeholder="Dejar vacío si se consulta">
          </div>
        </div>

        <label for="description">Descripción</label>
        <textarea id="description" maxlength="2000"></textarea>

        <label for="image">Foto del producto</label>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
        <p id="currentImage" class="muted"></p>

        <label class="check">
          <input id="active" type="checkbox" checked>
          Producto visible en el catálogo
        </label>

        <div class="actions">
          <button class="primary" type="submit">Guardar producto</button>
          <button class="secondary" type="button" id="cancelEdit">Limpiar formulario</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Productos cargados</h2>
      <p class="muted">Desde acá podés editar, ocultar o eliminar productos.</p>
      <button class="secondary" id="refresh" type="button">Actualizar lista</button>
      <div id="productsList" style="margin-top:16px"></div>
    </section>
  </section>

  <div id="message" role="status" aria-live="polite"></div>
</main>

<script>
/* Configuración del proyecto Deco Adhesivos */
const SUPABASE_URL = "https://igwavqybzsooyutezfat.supabase.co";
const SUPABASE_KEY = "sb_publishable__FdJbCAPU_x_3kXAlMKoeQ_zdDQDe30";
const ADMIN_UID = "05c8f1bd-6a78-4fb8-8964-fc666d0a8b7b";
const BUCKET = "deco-productos";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentImageUrl = "";
let products = [];

function showMessage(text, error = false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#a32020" : "#35483d";
}

function money(value) {
  if (value == null || value === "") return "Precio a consultar";
  return new Intl.NumberFormat("es-AR", {
    style: "currency",
    currency: "ARS",
    maximumFractionDigits: 2
  }).format(Number(value));
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function setLoggedIn(isAdmin) {
  $("loginPanel").classList.toggle("hidden", isAdmin);
  $("adminPanel").classList.toggle("hidden", !isAdmin);
  $("logout").classList.toggle("hidden", !isAdmin);
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();
  if (error) {
    showMessage("No se pudo comprobar la sesión: " + error.message, true);
    return;
  }

  const user = data.session?.user;

  if (!user) {
    setLoggedIn(false);
    return;
  }

  if (user.id !== ADMIN_UID) {
    await db.auth.signOut();
    setLoggedIn(false);
    showMessage("Esta cuenta no tiene permiso para administrar Deco.", true);
    return;
  }

  setLoggedIn(true);
  await loadProducts();
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  showMessage("Verificando acceso...");

  const { data, error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  if (error) {
    showMessage("No se pudo iniciar sesión: " + error.message, true);
    return;
  }

  if (data.user.id !== ADMIN_UID) {
    await db.auth.signOut();
    showMessage("Esta cuenta no está autorizada para administrar Deco.", true);
    return;
  }

  $("password").value = "";
  setLoggedIn(true);
  showMessage("Sesión iniciada.");
  await loadProducts();
});

$("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  setLoggedIn(false);
  resetForm();
  showMessage("Sesión cerrada.");
});

async function loadProducts() {
  showMessage("Cargando productos...");

  const { data, error } = await db
    .from("productos")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    showMessage("Error al cargar productos: " + error.message, true);
    return;
  }

  products = data || [];
  renderList();
  showMessage("Productos cargados: " + products.length);
}

function renderList() {
  const list = $("productsList");

  if (!products.length) {
    list.innerHTML = '<p class="muted">Todavía no hay productos.</p>';
    return;
  }

  list.innerHTML = products.map(p => `
    <article class="item">
      ${p.imagen_url
        ? `<img src="${escapeHTML(p.imagen_url)}" alt="">`
        : `<div style="width:85px;height:85px;background:#f4f0e8;border-radius:6px"></div>`
      }
      <div class="item-info">
        <strong>${escapeHTML(p.nombre)}</strong>
        <span>${escapeHTML(money(p.precio))}</span>
        <small>Código: ${escapeHTML(p.codigo)} · ${escapeHTML(p.categoria)}</small>
        <small>${p.activo ? "Visible en catálogo" : "Oculto"}</small>
      </div>
      <div class="item-actions">
        <button class="secondary" data-action="edit" data-id="${p.id}">Editar</button>
        <button class="secondary" data-action="toggle" data-id="${p.id}">
          ${p.activo ? "Ocultar" : "Publicar"}
        </button>
        <button class="danger" data-action="delete" data-id="${p.id}">Eliminar</button>
      </div>
    </article>
  `).join("");
}

$("productsList").addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = Number(button.dataset.id);
  const product = products.find(p => Number(p.id) === id);
  if (!product) return;

  if (button.dataset.action === "edit") {
    $("productId").value = product.id;
    $("name").value = product.nombre || "";
    $("code").value = product.codigo || "";
    $("category").value = product.categoria || "";
    $("price").value = product.precio ?? "";
    $("description").value = product.descripcion || "";
    $("active").checked = Boolean(product.activo);
    $("image").value = "";
    currentImageUrl = product.imagen_url || "";
    $("currentImage").textContent = currentImageUrl
      ? "Ya hay una foto guardada. Si no elegís otra, se conservará."
      : "Todavía no hay una foto guardada.";
    $("formTitle").textContent = "Editar producto";
    $("productForm").scrollIntoView({ behavior: "smooth" });
    showMessage("Editando: " + product.nombre);
    return;
  }

  if (button.dataset.action === "toggle") {
    const { error } = await db.from("productos")
      .update({ activo: !product.activo })
      .eq("id", id);

    if (error) {
      showMessage("No se pudo cambiar la visibilidad: " + error.message, true);
      return;
    }

    await loadProducts();
    return;
  }

  if (button.dataset.action === "delete") {
    if (!confirm(`¿Eliminar "${product.nombre}" definitivamente?`)) return;

    const { error } = await db.from("productos").delete().eq("id", id);

    if (error) {
      showMessage("No se pudo eliminar: " + error.message, true);
      return;
    }

    if ($("productId").value === String(id)) resetForm();
    await loadProducts();
    showMessage("Producto eliminado.");
  }
});

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();

  const { data: sessionData } = await db.auth.getSession();
  const user = sessionData.session?.user;

  if (!user || user.id !== ADMIN_UID) {
    setLoggedIn(false);
    showMessage("La sesión no está autorizada. Volvé a iniciar sesión.", true);
    return;
  }

  const id = $("productId").value;
  const file = $("image").files[0];
  let imageUrl = currentImageUrl;

  if (file) {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      showMessage("Usá una imagen JPG, PNG o WebP.", true);
      return;
    }

    if (file.size > 8 * 1024 * 1024) {
      showMessage("La imagen supera el límite de 8 MB.", true);
      return;
    }

    showMessage("Subiendo imagen...");

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const filePath = `${crypto.randomUUID()}-${safeName}`;

    const { error: uploadError } = await db.storage
      .from(BUCKET)
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (uploadError) {
      showMessage("No se pudo subir la foto: " + uploadError.message, true);
      return;
    }

    const { data: publicData } = db.storage
      .from(BUCKET)
      .getPublicUrl(filePath);

    imageUrl = publicData.publicUrl;
  }

  const priceText = $("price").value.trim();

  const product = {
    nombre: $("name").value.trim(),
    codigo: $("code").value.trim(),
    categoria: $("category").value.trim(),
    precio: priceText === "" ? null : Number(priceText),
    descripcion: $("description").value.trim(),
    imagen_url: imageUrl || null,
    activo: $("active").checked
  };

  if (!product.nombre || !product.codigo || !product.categoria) {
    showMessage("Completá nombre, código y categoría.", true);
    return;
  }

  showMessage("Guardando producto...");

  const result = id
    ? await db.from("productos").update(product).eq("id", Number(id))
    : await db.from("productos").insert(product);

  if (result.error) {
    showMessage("No se pudo guardar: " + result.error.message, true);
    return;
  }

  resetForm();
  await loadProducts();
  showMessage(id ? "Producto actualizado." : "Producto agregado.");
});

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  $("active").checked = true;
  $("image").value = "";
  currentImageUrl = "";
  $("currentImage").textContent = "";
  $("formTitle").textContent = "Agregar producto";
}

$("cancelEdit").addEventListener("click", resetForm);
$("refresh").addEventListener("click", loadProducts);

checkSession();
</script>
</body>
</html>
